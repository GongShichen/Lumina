<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Lumina App 架构</title>
  <desc id="desc">Lumina App 的 SwiftUI、App Services、Runtime、Memory、ModelRuntime、系统 Frameworks 与数据流。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26231f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d1a15" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fffaf0; }
      .layer { fill: #fffdf7; stroke: #e7dfcb; stroke-width: 2.2; filter: url(#shadow); }
      .runtime { fill: #fff6d8; stroke: #ffc247; stroke-width: 3; filter: url(#shadow); }
      .memory { fill: #eefbf4; stroke: #74d9a1; stroke-width: 2.5; }
      .model { fill: #effbff; stroke: #70d7ee; stroke-width: 2.5; }
      .system { fill: #f7f4ef; stroke: #d6ccbd; stroke-width: 2; }
      .ui { fill: #ffffff; stroke: #dfd8c9; stroke-width: 2; }
      .secure { fill: #fff0f1; stroke: #ff9aa7; stroke-width: 2; }
      .text { font: 500 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #26231f; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #5e5a52; }
      .tiny { font: 500 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #716d65; }
      .title { font: 800 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #171512; }
      .section { font: 800 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #171512; }
      .mono { font: 700 16px "SF Mono", Menlo, Consolas, monospace; fill: #26231f; }
      .line { stroke: #26231f; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #9e9788; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text x="64" y="70" class="title">Lumina App：本地优先个人助手架构</text>
  <text x="64" y="108" class="small">SwiftUI 数据驱动界面 + App 层工具注册 + 纯 AgentRuntime + Core ML 模型 + Personal Memory + 真实系统 Frameworks。</text>

  <rect x="56" y="150" width="1488" height="156" rx="30" class="layer"/>
  <text x="86" y="194" class="section">Presentation / SwiftUI</text>
  <rect x="86" y="220" width="190" height="58" rx="18" class="ui"/>
  <text x="108" y="256" class="text">Today</text>
  <rect x="296" y="220" width="190" height="58" rx="18" class="ui"/>
  <text x="318" y="256" class="text">Memory</text>
  <rect x="506" y="220" width="190" height="58" rx="18" class="ui"/>
  <text x="528" y="256" class="text">Activity</text>
  <rect x="716" y="220" width="190" height="58" rx="18" class="ui"/>
  <text x="738" y="256" class="text">Trust</text>
  <rect x="926" y="220" width="246" height="58" rx="18" class="ui"/>
  <text x="948" y="256" class="text">AskUser / Confirm</text>
  <rect x="1192" y="220" width="318" height="58" rx="18" class="ui"/>
  <text x="1214" y="256" class="text">Markdown / Live Activity</text>

  <rect x="56" y="346" width="1488" height="172" rx="30" class="layer"/>
  <text x="86" y="390" class="section">Application Services / ViewModels</text>
  <rect x="86" y="420" width="238" height="62" rx="18" class="ui"/>
  <text x="108" y="456" class="text">AgentHomeViewModel</text>
  <rect x="344" y="420" width="222" height="62" rx="18" class="ui"/>
  <text x="366" y="456" class="text">Prompt Builder</text>
  <rect x="586" y="420" width="238" height="62" rx="18" class="ui"/>
  <text x="608" y="456" class="text">Tool Factory</text>
  <rect x="844" y="420" width="264" height="62" rx="18" class="secure"/>
  <text x="866" y="456" class="text">Permission Policy</text>
  <rect x="1128" y="420" width="190" height="62" rx="18" class="ui"/>
  <text x="1150" y="456" class="text">Voice Input</text>
  <rect x="1338" y="420" width="172" height="62" rx="18" class="ui"/>
  <text x="1360" y="456" class="text">App Intents</text>

  <rect x="56" y="558" width="468" height="194" rx="30" class="layer"/>
  <text x="86" y="602" class="section">LuminaAppCore</text>
  <text x="86" y="636" class="small">可测试 domain、stores、tool schemas、跨平台 provider 协议</text>
  <rect x="86" y="662" width="184" height="54" rx="16" class="ui"/>
  <text x="106" y="696" class="text">Tools</text>
  <rect x="290" y="662" width="184" height="54" rx="16" class="ui"/>
  <text x="310" y="696" class="text">Stores</text>

  <rect x="566" y="558" width="468" height="194" rx="30" class="runtime"/>
  <text x="596" y="602" class="section">AgentRuntime</text>
  <text x="596" y="636" class="small">ReAct loop、streaming、tool router、confirmation、audit、hooks</text>
  <rect x="596" y="662" width="188" height="54" rx="16" class="ui"/>
  <text x="616" y="696" class="mono">tool_use</text>
  <rect x="804" y="662" width="188" height="54" rx="16" class="ui"/>
  <text x="824" y="696" class="mono">final_answer</text>

  <rect x="1076" y="558" width="468" height="194" rx="30" class="model"/>
  <text x="1106" y="602" class="section">LuminaModelRuntime</text>
  <text x="1106" y="636" class="small">MiniCPM-V ReAct model、BGE embedding、tokenizer、模型资产校验</text>
  <rect x="1106" y="662" width="184" height="54" rx="16" class="ui"/>
  <text x="1126" y="696" class="text">MiniCPM-V Step generator</text>
  <rect x="1310" y="662" width="184" height="54" rx="16" class="ui"/>
  <text x="1330" y="696" class="text">BGE Embedding</text>

  <rect x="56" y="792" width="468" height="164" rx="30" class="memory"/>
  <text x="86" y="836" class="section">PersonalMemory</text>
  <text x="86" y="870" class="small">ingest / chunk / metadata filter / vector search / recent / delete</text>
  <text x="86" y="910" class="mono">memory.ingest_text</text>

  <rect x="566" y="792" width="468" height="164" rx="30" class="system"/>
  <text x="596" y="836" class="section">Local Persistence</text>
  <text x="596" y="870" class="small">Documents、JSONL audit、ledger、subscription、note files</text>
  <text x="596" y="910" class="mono">App sandbox only</text>

  <rect x="1076" y="792" width="468" height="164" rx="30" class="system"/>
  <text x="1106" y="836" class="section">Apple System Frameworks</text>
  <text x="1106" y="870" class="small">EventKit、Contacts、CoreLocation、Speech、UserNotifications</text>
  <text x="1106" y="902" class="small">WeatherKit / HealthKit（iOS only）、Vision、PDFKit、Files、Clipboard</text>

  <path class="line" d="M 181 278 C 181 332 205 350 205 420"/>
  <path class="line" d="M 421 278 C 421 332 455 350 455 420"/>
  <path class="line" d="M 976 482 C 976 530 800 520 800 558"/>
  <path class="line" d="M 705 482 C 705 530 800 520 800 558"/>
  <path class="line" d="M 800 752 C 800 778 800 770 800 792"/>
  <path class="line" d="M 1034 655 L 1076 655"/>
  <path class="line" d="M 566 655 L 524 655"/>
  <path class="line" d="M 290 752 L 290 792"/>
  <path class="line" d="M 1310 752 C 1310 775 1310 770 1310 792"/>
  <path class="softline" d="M 1400 482 C 1460 540 1460 740 1310 792"/>
  <path class="softline" d="M 1310 716 C 1310 754 320 754 320 792"/>
  <path class="softline" d="M 290 792 C 210 760 185 745 185 716"/>

  <rect x="64" y="978" width="1472" height="42" rx="18" class="ui"/>
  <text x="92" y="1005" class="tiny">关键路径：用户输入 -> ViewModel -> App prompt/context/tool registration -> AgentRuntime ReAct -> App tools -> 系统 API / 本地 store -> Observation -> Markdown 回复。</text>
</svg>
