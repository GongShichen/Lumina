name: Lumina
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "26.0"
packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.8.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.0.0
  CoreMLLLM:
    url: https://github.com/john-rocky/CoreML-LLM.git
    branch: main
targets:
  AgentRuntime:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/AgentRuntime/Info.plist
    sources:
      - path: Sources/AgentRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.AgentRuntime
        PRODUCT_NAME: AgentRuntime
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  PersonalMemory:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/PersonalMemory/Info.plist
    sources:
      - path: Sources/PersonalMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.PersonalMemory
        PRODUCT_NAME: PersonalMemory
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  LuminaMarkdownUI:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/LuminaMarkdownUI/Info.plist
    sources:
      - path: Sources/LuminaMarkdownUI
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.LuminaMarkdownUI
        PRODUCT_NAME: LuminaMarkdownUI
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  LuminaModelRuntime:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/LuminaModelRuntime/Info.plist
    sources:
      - path: Sources/LuminaModelRuntime
    dependencies:
      - target: AgentRuntime
      - target: PersonalMemory
      - package: CoreMLLLM
        product: CoreMLLLM
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.LuminaModelRuntime
        PRODUCT_NAME: LuminaModelRuntime
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  LuminaAppCore:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/LuminaAppCore/Info.plist
    sources:
      - path: Sources/LuminaAppCore
    dependencies:
      - target: AgentRuntime
      - target: PersonalMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.LuminaAppCore
        PRODUCT_NAME: LuminaAppCore
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  Lumina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/LuminaApp
      - path: Resources/Models
        buildPhase: resources
        type: folder
        optional: true
    info:
      path: Sources/LuminaApp/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: Lumina 需要访问日历，用于查询和创建你明确请求的日程。
        NSRemindersFullAccessUsageDescription: Lumina 需要访问提醒事项，用于创建你确认过的提醒。
        NSContactsUsageDescription: Lumina 需要访问通讯录，用于查找你指定联系人的最小必要信息。
        NSLocationWhenInUseUsageDescription: Lumina 需要在使用期间获取当前位置，用于回答你主动提出的位置相关请求。
        NSMicrophoneUsageDescription: Lumina 需要使用麦克风，把你的语音输入转成文本。
        NSSpeechRecognitionUsageDescription: Lumina 需要使用端侧语音识别，把你的语音输入转成文本。
        NSHealthShareUsageDescription: Lumina 只会在你明确请求时读取健康摘要，用于本地回答你的问题。
        NSSupportsLiveActivities: true
    dependencies:
      - target: AgentRuntime
      - target: PersonalMemory
      - target: LuminaModelRuntime
      - target: LuminaMarkdownUI
      - target: LuminaAppCore
      - target: LuminaWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.Lumina.test.gsc
        PRODUCT_NAME: Lumina
        DEVELOPMENT_TEAM: Z6N4X8M8TZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,6"
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Sources/LuminaApp/Lumina.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Sources/LuminaApp/Lumina.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Sources/LuminaApp/LuminaMacCatalyst.entitlements

  LuminaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/LuminaWidgets
    info:
      path: Sources/LuminaWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: LuminaAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.Lumina.test.gsc.widgets
        PRODUCT_NAME: LuminaWidgets
        DEVELOPMENT_TEAM: Z6N4X8M8TZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  AgentRuntime:
    build:
      targets:
        AgentRuntime: all
  PersonalMemory:
    build:
      targets:
        PersonalMemory: all
  LuminaMarkdownUI:
    build:
      targets:
        LuminaMarkdownUI: all
  LuminaAppCore:
    build:
      targets:
        LuminaAppCore: all
  LuminaModelRuntime:
    build:
      targets:
        LuminaModelRuntime: all
  Lumina:
    build:
      targets:
        AgentRuntime: all
        PersonalMemory: all
        LuminaModelRuntime: all
        LuminaMarkdownUI: all
        LuminaAppCore: all
        LuminaWidgets: all
        Lumina: all
    run:
      config: Debug
    test:
      config: Debug
