name: Lumina
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "26.0"
packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.8.0
targets:
  AgentRuntime:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/AgentRuntime/Info.plist
    sources:
      - path: Sources/AgentRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.AgentRuntime
        PRODUCT_NAME: AgentRuntime
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  PersonalMemory:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/PersonalMemory/Info.plist
    sources:
      - path: Sources/PersonalMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.PersonalMemory
        PRODUCT_NAME: PersonalMemory
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  LuminaMarkdownUI:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/LuminaMarkdownUI/Info.plist
    sources:
      - path: Sources/LuminaMarkdownUI
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.LuminaMarkdownUI
        PRODUCT_NAME: LuminaMarkdownUI
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  LuminaAppCore:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/LuminaAppCore/Info.plist
    sources:
      - path: Sources/LuminaAppCore
    dependencies:
      - target: AgentRuntime
      - target: PersonalMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.LuminaAppCore
        PRODUCT_NAME: LuminaAppCore
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES

  Lumina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/LuminaApp
    resources:
      - path: Resources/Models
        optional: true
    info:
      path: Sources/LuminaApp/Info.plist
    dependencies:
      - target: AgentRuntime
      - target: PersonalMemory
      - target: LuminaMarkdownUI
      - target: LuminaAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.Lumina
        PRODUCT_NAME: Lumina
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: YES
schemes:
  AgentRuntime:
    build:
      targets:
        AgentRuntime: all
  PersonalMemory:
    build:
      targets:
        PersonalMemory: all
  LuminaMarkdownUI:
    build:
      targets:
        LuminaMarkdownUI: all
  LuminaAppCore:
    build:
      targets:
        LuminaAppCore: all
  Lumina:
    build:
      targets:
        AgentRuntime: all
        PersonalMemory: all
        LuminaMarkdownUI: all
        LuminaAppCore: all
        Lumina: all
    run:
      config: Debug
    test:
      config: Debug
