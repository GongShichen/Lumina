model:
  name_or_path: /root/rivermind-data/lumina-agentic-training/models/base/openbmb-MiniCPM-V-4.6
  adapter_path: /root/rivermind-data/lumina-agentic-training/runs/sft-lora
  load_in_8bit: true
  torch_dtype: bfloat16
  freeze_patterns:
    - vision
    - visual
    - projector
    - resampler
data:
  train_file: ../TrainingData/splits/dpo_general_train.jsonl
  eval_file: ../TrainingData/splits/dpo_general_test.jsonl
  downsample_mode: 16x
  max_slice_nums: 9
training:
  output_dir: /root/rivermind-data/lumina-agentic-training/runs/dpo-lora
  run_name: minicpmv46-agentic-dpo
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  num_train_epochs: 2
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  report_to: swanlab
  beta: 0.1
  max_length: 2048
  max_prompt_length: 3072
  bf16: true
  tf32: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  remove_unused_columns: false
  ddp_find_unused_parameters: true
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  exclude_modules: ".*(vision|visual|projector|resampler|merger).*"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
