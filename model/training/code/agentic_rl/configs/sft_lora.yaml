model:
  name_or_path: /root/rivermind-data/lumina-agentic-training/models/base/openbmb-MiniCPM-V-4.6
  load_in_8bit: false
  torch_dtype: bfloat16
  freeze_patterns:
    - vision
    - visual
    - projector
    - resampler
data:
  train_file: ../TrainingData/splits/sft_general_train.jsonl
  eval_file: ../TrainingData/splits/sft_general_test.jsonl
  downsample_mode: 16x
  max_slice_nums: 9
training:
  output_dir: /root/rivermind-data/lumina-agentic-training/runs/sft-lora
  run_name: minicpmv46-agentic-xml-sft-strong
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00008
  num_train_epochs: 4
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  save_steps: 100
  save_total_limit: 3
  report_to: swanlab
  max_length: 8192
  bf16: true
  tf32: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  remove_unused_columns: false
  ddp_find_unused_parameters: false
lora:
  r: 128
  lora_alpha: 256
  lora_dropout: 0.04
  bias: none
  task_type: CAUSAL_LM
  exclude_modules: ".*(vision|visual|projector|resampler|merger).*"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
