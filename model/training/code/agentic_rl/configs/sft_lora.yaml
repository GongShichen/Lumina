model:
  name_or_path: /root/rivermind-data/lumina-agentic-training/models/base/openbmb-MiniCPM-V-4.6
  load_in_8bit: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
  freeze_patterns:
    - vision
    - visual
    - projector
    - resampler
data:
  train_file: /root/rivermind-data/lumina-agentic-training/data/TrainingData/splits/sft_general_train.jsonl
  eval_file: /root/rivermind-data/lumina-agentic-training/data/TrainingData/splits/sft_general_test.jsonl
  downsample_mode: 16x
  max_slice_nums: 9
training:
  output_dir: /root/rivermind-data/lumina-agentic-training/runs/sft-lora
  run_name: lumina-agentic-sft-native-a800-r64-b64-fixed4096-v2
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  lr_scheduler_type: cosine
  warmup_steps: 24
  num_train_epochs: 2
  early_stopping_patience: 2
  early_stopping_threshold: 0.0005
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: swanlab
  max_length: 4096
  bf16: true
  tf32: true
  gradient_checkpointing: true
  optim: adamw_torch_fused
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  remove_unused_columns: false
  ddp_find_unused_parameters: false
lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.04
  bias: none
  task_type: CAUSAL_LM
  exclude_modules: ".*(vision|visual|projector|resampler|merger).*"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
