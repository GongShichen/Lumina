[project]
name = "lumina-agentic-rl"
version = "0.1.0"
description = "Offline Agentic RL tooling for Lumina ReAct trajectories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "deepspeed",
    "einops",
    "flash-linear-attention>=0.5.1",
    "jsonschema",
    "modelscope",
    "peft",
    "pillow",
    "protobuf",
    "pydantic>=2.7",
    "pyyaml",
    "rich",
    "sentencepiece",
    "swanlab",
    "torch",
    "torchvision",
    "transformers",
    "trl",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
lumina-arl-validate = "lumina_agentic_rl.validate:main"
lumina-arl-evaluate = "lumina_agentic_rl.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
